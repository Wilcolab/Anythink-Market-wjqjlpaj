[tool.poetry]
name = "Anythink Market Backend"
version = "0.0.0"
description = "Backend logic implementation for Anythink Market"
authors=["Anythink"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
uvicorn = "^0.30.0"
fastapi = "^0.115.0"
pydantic = { version = "^2.9.0", extras = ["email"] }
pydantic-settings = "^2.5.0"
passlib = { version = "^1.7", extras = ["bcrypt"] }
pyjwt = "^2.9.0"
databases = "^0.9.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
aiosql = "^12.0"
pypika = "^0.48.9"
alembic = "^1.13.0"
python-slugify = "^8.0.0"
Unidecode = "^1.3"
loguru = "^0.7.0"
requests = "^2.32.0"
gunicorn = "^23.0.0"
greenlet = "^3.1.0"

[tool.poetry.dev-dependencies]
black = "^24.0.0"
isort = "^5.13.0"
autoflake = "^2.3.0"
mypy = "^1.11.0"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.24.0"
pytest-env = "^1.1.0"
pytest-xdist = "^3.6.0"
httpx = "^0.27.0"
asgi-lifespan = "^2.1.0"

[tool.isort]
profile = "black"
src_paths = ["app", "tests"]
combine_as_imports = true

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = "error"
addopts = '''
  --strict-markers
  --tb=short
  --cov=app
  --cov=tests
  --cov-branch
  --cov-report=term-missing
  --cov-report=html
  --cov-report=xml
  --no-cov-on-fail
  --cov-fail-under=100
  --numprocesses=auto
  --asyncio-mode=auto
'''
env = [
  "SECRET_KEY=e6F9KvSDf4dyXj",
  "MAX_CONNECTIONS_COUNT=1",
  "MIN_CONNECTIONS_COUNT=1"
]

[build-system]
requires = ["poetry>=1.0"]
build-backend = "poetry.masonry.api"
