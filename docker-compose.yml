services:
  anythink-backend-python:
    build:
      context: .
      dockerfile: backend/Dockerfile.aws
    container_name: anythink-backend-python
    command: >
      sh -c "cd backend &&
            poetry export -f "requirements.txt" --without-hashes --with-credentials > "requirements.txt" &&
            poetry run alembic upgrade head &&
            poetry run uvicorn app.main:app --host=0.0.0.0 --port=3000 --reload"
    working_dir: /usr/src
    volumes:
      - ./:/usr/src
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=dev
      - SECRET_KEY=secret
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:@postgres-python:5432/anythink-market
      - GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN=${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - "postgres-python"

  anythink-frontend-react:
    build:
      context: .
      dockerfile: frontend/Dockerfile.aws
    container_name: anythink-frontend-react
    command: sh -c "cd frontend && REACT_APP_WILCO_ID=${WILCO_ID} npm start"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REACT_APP_BACKEND_URL=${CODESPACE_BACKEND_URL:-http://localhost:3000}
      - WDS_SOCKET_PORT=${CODESPACE_WDS_SOCKET_PORT:-3001}
    working_dir: /usr/src
    volumes:
      - ./frontend/src:/usr/src/frontend/src
      - ./frontend/public:/usr/src/frontend/public
      - ./frontend/index.html:/usr/src/frontend/index.html
      - ./frontend/vite.config.js:/usr/src/frontend/vite.config.js
      - ./frontend/package.json:/usr/src/frontend/package.json
      - ./.wilco:/usr/src/.wilco
    ports:
      - "3001:3001"
    depends_on:
      - "anythink-backend-python"

  postgres-python:
    container_name: postgres-python
    restart: on-failure
    image: postgres
    logging:
      driver: none
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anythink-market
    volumes:
      - ~/postgres/data:/data/db
    ports:
      - '5433:5432'

  anythink-ack:
    image: public.ecr.aws/v0a2l7y2/wilco/anythink-ack:latest
    container_name: anythink-ack
    environment:
      - GITHUB_TOKEN=$GITHUB_TOKEN
      - CODESPACE_NAME=$CODESPACE_NAME
    depends_on:
      - "anythink-frontend-react"
